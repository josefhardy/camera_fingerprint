[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camfp"
version = "0.1.0"
description = "Which camera took this photo? Sensor fingerprinting (PRNU) vs deep learning, robustness to social media, and a privacy defence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyWavelets>=1.5",
    "pillow>=10.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cnn = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
camfp = "camfp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
